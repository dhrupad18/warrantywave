server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/warrantywave?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info

warrantywave.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
warrantywave.bootstrap.admin-email=${ADMIN_EMAIL:}
warrantywave.bootstrap.admin-password=${ADMIN_PASSWORD:}
warrantywave.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-7h2Wq9Vt4Kp8Dx3M}
warrantywave.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}
warrantywave.credit.base-score=300
warrantywave.credit.approve-threshold=700
warrantywave.credit.review-threshold=550
warrantywave.rate.band-a=${RATE_BAND_A:8.5}
warrantywave.rate.band-b=${RATE_BAND_B:11.0}
warrantywave.rate.band-c=${RATE_BAND_C:14.0}
warrantywave.late-fee-percent=${LATE_FEE_PERCENT:2.0}