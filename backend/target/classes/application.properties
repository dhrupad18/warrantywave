server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info

warrantywave.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
warrantywave.bootstrap.admin-email=${ADMIN_EMAIL:}
warrantywave.bootstrap.admin-password=${ADMIN_PASSWORD:}
warrantywave.jwt.secret=${JWT_SECRET}
warrantywave.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}
warrantywave.credit.base-score=300
warrantywave.credit.approve-threshold=700
warrantywave.credit.review-threshold=550
warrantywave.rate.band-a=${RATE_BAND_A:8.5}
warrantywave.rate.band-b=${RATE_BAND_B:11.0}
warrantywave.rate.band-c=${RATE_BAND_C:14.0}
warrantywave.late-fee-percent=${LATE_FEE_PERCENT:2.0}